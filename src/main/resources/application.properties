spring.application.name=synxo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.sql.init.mode=always
app.storage.upload-dir=./uploads
app.location.geocoding.enabled=true
app.location.nominatim.base-url=https://nominatim.openstreetmap.org/search
app.location.nominatim.user-agent=SynxoCoursework/1.0 (student course project)
app.location.default-latitude=53.9006
app.location.default-longitude=27.5590

spring.datasource.url=jdbc:sqlite:./data/synxo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
